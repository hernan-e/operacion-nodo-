<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1210">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Operación Nodo — Geografía Militar</title>
<style>
  :root{--bg:#0d1210;--panel:#161f18;--panel2:#1e2b21;--linea:#33473a;
    --verde:#7fb069;--verde2:#a3d18a;--amarillo:#e0c56e;--rojo:#d9645a;
    --texto:#e8efe6;--gris:#9fb3a2;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--texto);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;
    background:#0a0f0c;border-bottom:2px solid var(--linea);position:sticky;top:0;z-index:1000;flex-wrap:wrap;gap:8px;}
  #hud .logo{font-weight:700;letter-spacing:1px;color:var(--verde2);}
  #hud .hud-r{display:flex;gap:12px;align-items:center;font-size:15px;color:var(--gris);flex-wrap:wrap;}
  .pts{background:var(--panel2);border:1px solid var(--linea);padding:4px 12px;border-radius:20px;color:var(--amarillo);font-weight:700;}
  .timer{background:var(--panel2);border:1px solid var(--linea);padding:4px 12px;border-radius:20px;
    color:var(--verde2);font-weight:700;font-variant-numeric:tabular-nums;display:none;}
  .timer.warn{background:#3b2a12;color:var(--amarillo);border-color:var(--amarillo);}
  .timer.crit{background:#3b1212;color:var(--rojo);border-color:var(--rojo);animation:pulso 1s infinite;}
  @keyframes pulso{50%{opacity:.55;}}
  main{max-width:1000px;margin:0 auto;padding:24px 16px 120px;}
  .card{background:var(--panel);border:1px solid var(--linea);border-radius:14px;padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.35);}
  .centro{text-align:center;}
  h1{font-size:32px;margin:6px 0;letter-spacing:2px;}
  h2{font-size:21px;margin:6px 0 16px;color:var(--verde2);}
  .sub{color:var(--gris);margin-top:0;}
  .barra{display:flex;justify-content:space-between;font-size:13px;letter-spacing:1px;color:var(--amarillo);
    border-bottom:1px solid var(--linea);padding-bottom:10px;margin-bottom:18px;text-transform:uppercase;gap:8px;flex-wrap:wrap;}
  .btn{background:var(--verde);color:#0d1210;border:none;padding:14px 28px;border-radius:10px;font-size:17px;
    font-weight:700;cursor:pointer;letter-spacing:1px;margin-top:16px;transition:.15s;}
  .btn:hover{background:var(--verde2);transform:translateY(-1px);}
  .btn.sec{background:transparent;color:var(--verde2);border:1px solid var(--linea);}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  input,select,textarea{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid var(--linea);
    background:#0f1712;color:var(--texto);font-size:16px;font-family:inherit;}
  textarea{resize:vertical;min-height:90px;}
  label{display:block;text-align:left;margin-top:18px;color:var(--gris);font-size:14px;}
  .ops{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .op{text-align:left;padding:14px 16px;border-radius:10px;cursor:pointer;background:var(--panel2);
    color:var(--texto);border:1px solid var(--linea);font-size:16px;transition:.15s;}
  .op:hover:not(:disabled){border-color:var(--verde);transform:translateX(3px);}
  .op:disabled{cursor:default;opacity:.95;}
  .op .letra{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;
    background:#0f1712;border-radius:50%;margin-right:10px;font-weight:700;color:var(--amarillo);font-size:14px;}
  .op.ok{background:#1d3320;border-color:var(--verde);}
  .op.mal{background:#331d1d;border-color:var(--rojo);}
  .fb{margin-top:18px;}
  .bien{color:var(--verde2);font-weight:700;margin:0;}
  .mal2{color:var(--rojo);font-weight:700;margin:0;}
  .expl{color:var(--gris);margin:6px 0 0;font-size:15px;}
  .mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:18px 0;}
  .pp{background:var(--panel2);border:1px solid var(--linea);border-radius:12px;padding:14px;text-align:center;}
  .pp .ic{font-size:30px;display:block;}
  .pp .nm{font-weight:700;margin-top:4px;}
  .pp .pb{font-size:13px;color:var(--gris);}
  .pp.sel{border-color:var(--verde);background:#1d3320;box-shadow:0 0 0 2px var(--verde) inset;}
  .pp.clic{cursor:pointer;}
  .pp.clic:hover{border-color:var(--verde2);}
  .dossier{background:#0f1712;border-left:3px solid var(--amarillo);padding:14px 18px;border-radius:8px;margin-bottom:10px;}
  .dossier p{margin:6px 0;font-size:15px;}
  .inst{color:var(--gris);font-size:15px;}
  .fila{background:var(--panel2);border:1px solid var(--linea);border-radius:10px;padding:14px;margin-bottom:10px;}
  .f-nombre{font-weight:700;margin-bottom:10px;}
  .seg{display:flex;gap:8px;margin-bottom:8px;}
  .seg-btn{flex:1;padding:8px;border-radius:8px;border:1px solid var(--linea);background:#0f1712;color:var(--texto);cursor:pointer;font-weight:700;}
  .seg-btn.on{background:var(--verde);color:#0d1210;border-color:var(--verde);}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;}
  .chip{padding:10px 16px;border-radius:20px;border:1px solid var(--linea);background:var(--panel2);cursor:pointer;font-size:15px;}
  .chip.on{background:var(--verde);color:#0d1210;border-color:var(--verde);font-weight:700;}
  .tabla{width:100%;border-collapse:collapse;margin-top:14px;font-size:15px;}
  .tabla th,.tabla td{padding:10px;border-bottom:1px solid var(--linea);text-align:left;}
  .tabla th{color:var(--amarillo);font-size:13px;text-transform:uppercase;}
  .grande{font-size:52px;font-weight:800;color:var(--amarillo);margin:8px 0;}
  .fila-res{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--linea);}
  .sel-scenario{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:18px 0;}
  .sc-card{background:var(--panel2);border:2px solid var(--linea);border-radius:12px;padding:18px;cursor:pointer;text-align:left;transition:.15s;}
  .sc-card:hover{border-color:var(--verde2);transform:translateY(-2px);}
  .sc-card.on{border-color:var(--verde);background:#1d3320;box-shadow:0 0 0 2px var(--verde) inset;}
  .sc-card h3{margin:0 0 6px;color:var(--verde2);font-size:18px;}
  .sc-card p{margin:4px 0;color:var(--gris);font-size:14px;}

  /* Mapa Leaflet */
  #mapa-leaflet{height:420px;border-radius:12px;border:1px solid var(--linea);margin:14px 0;background:#0a0f0c;z-index:1;}
  .leaflet-popup-content{font-size:14px;}
  .leaflet-popup-content b{color:#e0c56e;}

  /* Live board flotante */
  #liveboard{position:fixed;bottom:16px;right:16px;background:rgba(22,31,24,.97);border:1px solid var(--linea);
    border-radius:12px;padding:12px 14px;min-width:200px;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.6);
    font-size:13px;z-index:1500;display:none;backdrop-filter:blur(6px);}
  #liveboard .lb-titulo{color:var(--amarillo);font-weight:700;font-size:11px;text-transform:uppercase;
    letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  #liveboard .lb-close{cursor:pointer;color:var(--gris);font-size:16px;line-height:1;padding:0 4px;}
  #liveboard .lb-row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--linea);gap:8px;}
  #liveboard .lb-row:last-child{border-bottom:none;}
  #liveboard .lb-row .nom{color:var(--texto);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #liveboard .lb-row .pts2{color:var(--verde2);font-weight:700;flex-shrink:0;}
  #liveboard .lb-row.yo .nom{color:var(--amarillo);}

  @media print{#hud,.no-print,#liveboard{display:none!important;}body{background:#fff;color:#000;}
    .card{box-shadow:none;border:1px solid #999;background:#fff;}h2,.sub{color:#000;}}
</style>
</head>

<div id="liveboard">

  </div>
  <div id="lb-lista"></div>
</div>

/* ---------- BASE DE DATOS LOCAL ---------- */
const DB_NAME = 'OperacionNodoDB';
const DB_VERSION = 1;
let db = null;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('resultados')){
        const s = d.createObjectStore('resultados',{keyPath:'id',autoIncrement:true});
        s.createIndex('equipo','equipo',{unique:false});
        s.createIndex('escenario','escenarioId',{unique:false});
        s.createIndex('fecha','fecha',{unique:false});
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function guardarResultado(r){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('resultados','readwrite');
    const req = tx.objectStore('resultados').add(r);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function obtenerResultados(){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('resultados','readonly');
    const req = tx.objectStore('resultados').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

/* ---------- SONIDO ---------- */
let audioCtx = null;
function sonido(t){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.type = 'sine';
    o.frequency.value = t==='ok' ? 880 : 180;
    g.gain.setValueAtTime(0.06, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.22);
    o.start(); o.stop(audioCtx.currentTime + 0.22);
  }catch(e){}
}

/* ---------- TEMPORIZADOR ---------- */
let timerInterval = null, timerRestante = 0;
function iniciarTimer(seg){
  detenerTimer();
  const el = document.getElementById('hud-timer');
  if(!seg || seg <= 0){ el.style.display = 'none'; return; }
  timerRestante = seg;
  el.style.display = '';
  const update = () => {
    const m = Math.floor(timerRestante/60), s = timerRestante%60;
    el.textContent = '⏱ ' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    el.className = 'timer';
    if(timerRestante <= 10) el.classList.add('crit');
    else if(timerRestante <= 30) el.classList.add('warn');
  };
  update();
  timerInterval = setInterval(()=>{
    timerRestante--;
    if(timerRestante <= 0){
      clearInterval(timerInterval); timerInterval = null;
      el.textContent = '⏱ ¡TIEMPO!'; el.className = 'timer crit';
      sonido('mal');
    } else update();
  },1000);
}
function detenerTimer(){
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('hud-timer').style.display = 'none';
}

/* ---------- MAPA ---------- */
let mapaActual = null;
let marcadores = {};

function destruirMapa(){
  if(mapaActual){ try{ mapaActual.remove(); }catch(e){} mapaActual = null; }
  marcadores = {};
}

function crearMapa(contenedorId, pps, corredor, onMarkerClick){
  destruirMapa();
  const el = document.getElementById(contenedorId);
  if(!el) return null;
  const sc = state.scenario;
  const map = L.map(el, {zoomControl:true}).setView(sc.centro, sc.zoom);
  L.tileLayer(TILE_URL, {attribution:TILE_ATTR, maxZoom:18}).addTo(map);
  pps.forEach(pp => {
    const esCorredor = corredor.includes(pp.id);
    const color = esCorredor ? '#7fb069' : '#e0c56e';
    const m = L.circleMarker(pp.coord, {
      radius: 11, fillColor: color, color: '#fff', weight: 2, fillOpacity: 0.9
    }).addTo(map);
    m.bindPopup(`<b>${pp.nombre}</b><br>${pp.pob}`);
    if(onMarkerClick){
      m.on('click', () => onMarkerClick(pp.id));
      m.getElement && setTimeout(()=>{ if(m.getElement()) m.getElement().style.cursor='pointer'; }, 50);
    }
    marcadores[pp.id] = m;
  });
  mapaActual = map;
  setTimeout(()=>map.invalidateSize(), 150);
  return map;
}

function marcarSeleccion(ppId, activo){
  if(!marcadores[ppId]) return;
  if(activo){
    marcadores[ppId].setStyle({fillColor:'#a3d18a', color:'#e0c56e', weight:4, radius:14});
    marcadores[ppId].bringToFront();
  } else {
    const pp = state.scenario.pps.find(p=>p.id===ppId);
    const esCorredor = state.scenario.corredor.includes(ppId);
    marcadores[ppId].setStyle({
      fillColor: esCorredor ? '#7fb069' : '#e0c56e',
      color:'#fff', weight:2, radius:11
    });
  }
}

  const sc = state.scenario;

    <div class="pp"><span class="ic">${p.icon}</span>
      <div class="nm">${p.nombre}</div><div class="pb">${p.pob}</div></div>`).join('');

  go(`
  <section class="card">
    <div class="barra"><span>FASE 0 · BRIEFING · ${sc.nombre}</span><span>${state.equipo}</span></div>
    <h2>${sc.icono} ${sc.nombre}</h2>
    <p>${sc.descripcion}</p>
    <div class="dossier"><p><b>🎯 Misión:</b> ${sc.mision}</p></div>
    <p class="inst">Mapa satelital de la región (haz clic en los marcadores para ver los centros poblados):</p>
    <div id="mapa-leaflet"></div>
    <div class="mapa">${mapa}</div>
    <button class="btn" id="btn-next">COMENZAR FASE 1 ▶</button>
  </section>`);
  requestAnimationFrame(() => crearMapa('mapa-leaflet', sc.pps, sc.corredor, null));
  document.getElementById('btn-next').onclick = pantallaRadar;
}

/* ============================================================
   MOTOR DE PREGUNTAS
   ============================================================ */
function preguntaUI(p, num, total, alSiguiente){
  go(`
  <section class="card">
    <div class="barra"><span>PREGUNTA ${num} / ${total}</span><span>${state.equipo}</span></div>
    <h2>${p.t}</h2>
    <div class="ops" id="ops"></div>
    <div class="fb" id="fb"></div>
  </section>`);
  const ops = document.getElementById('ops');
  p.o.forEach((o,i)=>{
    const b = document.createElement('button');
    b.className = 'op';
    b.innerHTML = `<span class="letra">${'ABCD'[i]}</span>${o}`;
    b.onclick = () => responder(i);
    ops.appendChild(b);
  });
  function responder(eleg){
    [...ops.children].forEach((b,j)=>{
      b.disabled = true;
      if(j === p.c) b.classList.add('ok');
      if(j === eleg && eleg !== p.c) b.classList.add('mal');
    });
    const bien = eleg === p.c;
    sonido(bien ? 'ok' : 'mal');
    document.getElementById('fb').innerHTML = `
      <p class="${bien?'bien':'mal2'}">${bien?'✅ ¡Correcto! +1 punto':'❌ Incorrecto. +0 puntos'}</p>
      <p class="expl">${p.e}</p>
      <button class="btn" id="sig">CONTINUAR ▶</button>`;
    document.getElementById('sig').onclick = () => alSiguiente(bien);
  }
}

/* ---------- RADAR ---------- */
function pantallaRadar(){
  destruirMapa();
  actualizarHUD();
  publicarEstado('radar');
  const arr = state.scenario.radar;
  if(state.radarIdx >= arr.length){ pantallaIntelIntro(); return; }
  if(state.radarIdx === 0) iniciarTimer(TIMERS.radar);
  preguntaUI(arr[state.radarIdx], state.radarIdx+1, arr.length, (bien)=>{
    if(bien) state.puntos.radar++;
    state.radarIdx++;
    actualizarHUD();
    publicarEstado('radar');
    pantallaRadar();
  });
}

/* ---------- INTELIGENCIA ---------- */
function pantallaIntelIntro(){
  detenerTimer();
  destruirMapa();
  publicarEstado('intel');
  const prioritarios = state.scenario.pps.filter(p=>p.corredor);
  state.dossier = barajar(prioritarios)[0];
  state.intel = {};
  state.razonesOrden = barajar(FACTORES.map(f=>({id:f.id, txt:f.razon})));
  iniciarTimer(TIMERS.intel);

  go(`
  <section class="card">
    <div class="barra"><span>FASE 2 · INTELIGENCIA</span><span>${state.equipo}</span></div>
    <h2>📂 Dossier recibido</h2>
    <p>Tu equipo recibió el dossier de <b>${state.dossier.nombre}</b>. Analízalo con los 5 factores.</p>
    <button class="btn" onclick="pantallaIntel()">ABRIR DOSSIER ▶</button>
  </section>`);
}

function pantallaIntel(){
  const pp = state.dossier, d = pp.datos;
  const filas = FACTORES.map(f=>`
    <div class="fila" data-fila="${f.id}">
      <div class="f-nombre">${f.icon} ${f.nombre}</div>
      <div class="seg">
        <button class="seg-btn" data-f="${f.id}" data-v="1">SÍ</button>
        <button class="seg-btn" data-f="${f.id}" data-v="0">NO</button>
      </div>
      <select data-sel="${f.id}" disabled>
        <option value="">— ¿Por qué importa? —</option>
        ${state.razonesOrden.map(r=>`<option value="${r.id}">${r.txt}</option>`).join('')}
      </select>
    </div>`).join('');

  go(`
  <section class="card">
    <div class="barra"><span>FASE 2 · INTELIGENCIA</span><span>${state.equipo}</span></div>
    <h2>${pp.icon} Dossier: ${pp.nombre}</h2>
    <div class="dossier">
      <p>👥 <b>Población:</b> ${d.poblacion}</p>
      <p>🛣️ <b>Vías:</b> ${d.vias}</p>
      <p>⛽ <b>Recursos:</b> ${d.recursos}</p>
      <p>🏙️ <b>Terreno:</b> ${d.terreno}</p>
      <p>🏛️ <b>Político:</b> ${d.politico}</p>
    </div>
    <p class="inst">Para cada factor: marca SÍ si está presente y elige POR QUÉ importa (2 pts por factor correcto).</p>
    <div id="filas">${filas}</div>
    <button class="btn" id="btn-intel">ENTREGAR ANÁLISIS ▶</button>
  </section>`);

  document.querySelectorAll('.seg-btn').forEach(b=>{
    b.onclick = () => {
      const f = b.dataset.f;
      const fila = b.closest('.fila');
      fila.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      const sel = fila.querySelector('select');
      const valor = b.dataset.v === '1';
      sel.disabled = !valor;
      if(!valor) sel.value = '';
      state.intel[f] = { presente: valor, razon: sel.value };
    };
  });
  document.querySelectorAll('select[data-sel]').forEach(s=>{
    s.onchange = () => {
      const f = s.dataset.sel;
      if(!state.intel[f]) state.intel[f] = { presente:true, razon:'' };
      state.intel[f].razon = s.value;
    };
  });
  document.getElementById('btn-intel').onclick = corregirIntel;
}

function corregirIntel(){
  let pts = 0; const detalle = [];
  FACTORES.forEach(f=>{
    const r = state.intel[f.id] || { presente:null, razon:'' };
    const real = state.dossier.factores[f.id];
    let p = 0, msg = '';
    if(r.presente === null){ msg = '⭕ Sin responder.'; }
    else if(r.presente === true){
      if(real){
        p = 1;
        if(r.razon === f.id){ p = 2; msg = '✅ Presente y bien justificado. +2'; }
        else { msg = '🟡 Presente, justificación incorrecta. +1'; }
      } else { msg = '❌ Ese factor NO está presente. +0'; }
    } else {
      if(!real){ p = 2; msg = '✅ Correcto: no está presente. +2'; }
      else { msg = '❌ Sí estaba presente. +0'; }
    }
    pts += p;
    detalle.push({nombre:f.nombre, icon:f.icon, msg});
  });
  state.puntos.intel = pts;
  actualizarHUD();
  publicarEstado('intel');
  sonido(pts >= 6 ? 'ok' : 'mal');
  const lista = detalle.map(d=>`
    <div class="fila"><div class="f-nombre">${d.icon} ${d.nombre}</div>
      <p class="expl" style="margin:0">${d.msg}</p></div>`).join('');
  go(`
  <section class="card">
    <div class="barra"><span>RESULTADO · INTELIGENCIA</span><span>${state.equipo}</span></div>
    <h2>Análisis entregado: ${pts} / 10 pts</h2>
    ${lista}
    <button class="btn" onclick="pantallaDecision()">PASAR A LA DECISIÓN ▶</button>
  </section>`);
}

/* ---------- DECISIÓN ---------- */
function pantallaDecision(){
  detenerTimer();
  destruirMapa();
  state.decision = {pps:[],factores:[]};
  actualizarHUD();
  publicarEstado('decision');
  iniciarTimer(TIMERS.decision);
  const sc = state.scenario;

  const mapa = sc.pps.map(p=>`
    <div class="pp clic" data-pp="${p.id}"><span class="ic">${p.icon}</span>
      <div class="nm">${p.nombre}</div><div class="pb">${p.pob}</div></div>`).join('');
  const chips = FACTORES.map(f=>`
    <div class="chip" data-fac="${f.id}">${f.icon} ${f.nombre}</div>`).join('');

  go(`
  <section class="card">
    <div class="barra"><span>FASE 3 · DECISIÓN</span><span>${state.equipo}</span></div>
    <h2>🎯 Escenario táctico</h2>
    <div class="dossier">
      <p><b>Misión:</b> ${sc.mision}</p>
      <p><b>Orden:</b> elige <b>2 centros poblados</b> para controlar primero y cita al menos <b>3 factores</b>.</p>
    </div>
    <p class="inst">Mapa satelital (clic en los marcadores para seleccionar):</p>
    <div id="mapa-leaflet"></div>
    <p class="inst">O selecciona desde aquí:</p>
    <div class="mapa" id="mapa-dec">${mapa}</div>
    <p class="inst">Marca los factores que justifican tu decisión (mínimo 3):</p>
    <div class="chips" id="chips-dec">${chips}</div>
    <button class="btn" id="btn-dec">ENTREGAR PLAN ▶</button>
  </section>`);

  const togglePP = (id) => {
    const i = state.decision.pps.indexOf(id);
    if(i >= 0){ state.decision.pps.splice(i,1); marcarSeleccion(id, false); }
    else {
      if(state.decision.pps.length >= 2){ alert('Solo 2 centros poblados.'); return; }
      state.decision.pps.push(id); marcarSeleccion(id, true);
    }
    document.querySelectorAll('[data-pp]').forEach(el=>{
      el.classList.toggle('sel', state.decision.pps.includes(el.dataset.pp));
    });
  };

  requestAnimationFrame(() => crearMapa('mapa-leaflet', sc.pps, sc.corredor, togglePP));

  document.querySelectorAll('[data-pp]').forEach(el=>{
    el.onclick = () => togglePP(el.dataset.pp);
  });
  document.querySelectorAll('[data-fac]').forEach(el=>{
    el.onclick = () => {
      const id = el.dataset.fac;
      const i = state.decision.factores.indexOf(id);
      if(i >= 0){ state.decision.factores.splice(i,1); el.classList.remove('on'); }
      else { state.decision.factores.push(id); el.classList.add('on'); }
    };
  });
  document.getElementById('btn-dec').onclick = corregirDecision;
}

function corregirDecision(){
  const elegidos = state.decision.pps;
  if(elegidos.length !== 2){ alert('Elige exactamente 2 centros poblados.'); return; }
  if(state.decision.factores.length < 3){ alert('Marca al menos 3 factores.'); return; }

  let pts = 0; const aciertos = [];
  elegidos.forEach(id=>{
    const pp = state.scenario.pps.find(p=>p.id === id);
    if(pp.corredor){ pts += 5; aciertos.push(`✅ ${pp.nombre}: está en el corredor. +5`); }
    else { aciertos.push(`❌ ${pp.nombre}: no está en el corredor principal. +0`); }
  });
  const validos = state.decision.factores.filter(fid =>
    elegidos.some(id => state.scenario.pps.find(p=>p.id === id).factores[fid])
  );
  const extra = validos.length >= 3 ? 5 : validos.length === 2 ? 3 : validos.length === 1 ? 1 : 0;
  pts += extra;
  state.puntos.decision = pts;
  actualizarHUD();
  publicarEstado('decision');
  sonido(pts >= 10 ? 'ok' : 'mal');
  const nombres = validos.map(id => FACTORES.find(f=>f.id===id).nombre).join(', ') || 'ninguno';

  go(`
  <section class="card">
    <div class="barra"><span>RESULTADO · DECISIÓN</span><span>${state.equipo}</span></div>
    <h2>Plan entregado: ${pts} / 15 pts</h2>
    ${aciertos.map(a=>`<div class="fila"><p class="expl" style="margin:0">${a}</p></div>`).join('')}
    <div class="fila">
      <div class="f-nombre">Factores válidos citados: ${validos.length}</div>
      <p class="expl" style="margin:0">${nombres} → +${extra} pts</p>
    </div>
    <div class="dossier" style="margin-top:16px">
      <p><b>🔑 Corredor óptimo:</b> ${state.scenario.corredor.map(id=>state.scenario.pps.find(p=>p.id===id).nombre).join(', ')}</p>
    </div>
    <button class="btn" onclick="pantallaSprint()">IR AL SPRINT FINAL ▶</button>
  </section>`);
}

/* ---------- SPRINT ---------- */
function pantallaSprint(){
  destruirMapa();
  actualizarHUD();
  publicarEstado('sprint');
  const arr = state.scenario.sprint;
  if(state.sprintIdx >= arr.length){ pantallaResultados(); return; }
  if(state.sprintIdx === 0) iniciarTimer(TIMERS.sprint);
  preguntaUI(arr[state.sprintIdx], state.sprintIdx+1, arr.length, (bien)=>{
    if(bien) state.puntos.sprint++;
    state.sprintIdx++;
    actualizarHUD();
    publicarEstado('sprint');
    pantallaSprint();
  });
}

/* ---------- RESULTADOS ---------- */
async function pantallaResultados(){
  detenerTimer();
  destruirMapa();
  const total = totalPts();
  const pct = Math.round((total/43)*100);
  let rango = '🎖️ Cadete en formación';
  if(pct >= 50) rango = '🎖️ Analista de inteligencia';
  if(pct >= 75) rango = '🎖️ Oficial de planificación';
  if(pct >= 90) rango = '🏅 Jefe de Estado Mayor';

  publicarEstado('final');

  const registro = {
    equipo: state.equipo, escenarioId: state.scenarioId, escenarioNombre: state.scenario.nombre,
    puntos: {...state.puntos}, total, porcentaje: pct, rango, fecha: new Date().toISOString()
  };
  try{ await openDB(); await guardarResultado(registro); }catch(e){ console.error(e); }

  const todos = await obtenerResultados().catch(()=>[]);
  const top = [...todos].sort((a,b)=>b.total - a.total).slice(0,8);
  const filasTop = top.map((s,i)=>`
    <tr><td>${i+1}</td><td>${s.equipo}</td><td>${s.escenarioNombre}</td><td><b>${s.total}</b></td></tr>`).join('');

  go(`
  <section class="card">
    <div class="barra"><span>INFORME FINAL · ${state.scenario.nombre}</span><span>${state.equipo}</span></div>
    <div class="centro">
      <div class="grande">${total} / 43</div>
      <p class="sub">${pct}% de efectividad · ${rango}</p>
    </div>
    <h2>Desglose por fase</h2>
    <div class="fila-res"><span>Fase 1 · Radar</span><b>${state.puntos.radar} / 8</b></div>
    <div class="fila-res"><span>Fase 2 · Inteligencia</span><b>${state.puntos.intel} / 10</b></div>
    <div class="fila-res"><span>Fase 3 · Decisión</span><b>${state.puntos.decision} / 15</b></div>
    <div class="fila-res"><span>Fase 4 · Sprint</span><b>${state.puntos.sprint} / 10</b></div>

    <h2 style="margin-top:28px">🔑 Los 5 factores</h2>
    ${FACTORES.map(f=>`<div class="fila"><div class="f-nombre">${f.icon} ${f.nombre}</div>
      <p class="expl" style="margin:0">${f.razon}</p></div>`).join('')}

    <h2 style="margin-top:28px">📝 Ticket de salida</h2>
    <p class="inst">Nombra 3 razones por las que un centro poblado es importante en geografía militar y da un ejemplo de cada una.</p>
    <textarea id="ticket" placeholder="1) ...&#10;2) ...&#10;3) ..."></textarea>

    <h2 style="margin-top:28px">🏆 Tabla de posiciones (local)</h2>
    <table class="tabla">
      <thead><tr><th>#</th><th>Equipo</th><th>Escenario</th><th>Puntos</th></tr></thead>
      <tbody>${filasTop || '<tr><td colspan="4">Sin registros aún</td></tr>'}</tbody>
    </table>

    <div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:24px">
      <button class="btn sec" onclick="window.print()">🖨️ IMPRIMIR</button>
      <button class="btn sec" onclick="descargarJSON()">⬇️ EXPORTAR JSON</button>
      <button class="btn sec" onclick="descargarCSV()">⬇️ EXPORTAR CSV</button>
      <button class="btn" onclick="reiniciar()">🔄 NUEVO EQUIPO</button>
    </div>
  </section>`);
}

function descargarJSON(){
  obtenerResultados().then(todos => {
    const blob = new Blob([JSON.stringify(todos,null,2)],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `operacion-nodo-${state.equipo.replace(/\s+/g,'_')}-${Date.now()}.json`;
    a.click();
  });
}
function descargarCSV(){
  obtenerResultados().then(todos => {
    const cab = ['Equipo','Escenario','Radar','Inteligencia','Decision','Sprint','Total','%','Rango','Fecha'];
    const filas = todos.map(s=>[s.equipo, s.escenarioNombre, s.puntos.radar, s.puntos.intel,
      s.puntos.decision, s.puntos.sprint, s.total, s.porcentaje+'%', s.rango,
      new Date(s.fecha).toLocaleString()]);
    const csv = [cab,...filas].map(f=>f.join(';')).join('\n');
    const blob = new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'operacion-nodo-resultados.csv';
    a.click();
  });
}

function reiniciar(){
  detenerTimer();
  destruirMapa();
  state.equipo = ''; state.scenarioId = null; state.scenario = null;
  state.puntos = {radar:0,intel:0,decision:0,sprint:0};
  state.radarIdx = 0; state.sprintIdx = 0;
  state.dossier = null; state.intel = {};
  state.decision = {pps:[],factores:[]};
  document.getElementById('liveboard').style.display = 'none';
  salaActual = null; equipoId = null;
  pantallaInicio();
}

/* ---------- ARRANQUE ---------- */
initFirebase();
openDB().then(()=>pantallaInicio()).catch(()=>pantallaInicio());
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
